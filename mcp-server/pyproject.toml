[project]
name = "audit-evidence-kit-mcp"
version = "0.4.0"
description = "MCP server that runs security scanners, normalizes findings, and exports them for ticketing tools"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp[cli]>=2.3",
    "packaging>=24",
]
# The scanners themselves are separate programs, not Python dependencies:
#   brew install gitleaks semgrep osv-scanner trivy
# (semgrep must NOT be installed here: it requires mcp<2.)
